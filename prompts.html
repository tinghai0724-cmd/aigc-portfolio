});

const modal = document.getElementById("modal");
let curDoc = null;
function openModal(d){
  curDoc = d;
  document.getElementById("mTitle").textContent = d.title;
  document.getElementById("mMeta").textContent = d.file + " · " + d.text.length + " 字";
  document.getElementById("mBody").textContent = d.text;
  modal.classList.add("open");
}
document.getElementById("mClose").addEventListener("click",()=>modal.classList.remove("open"));
modal.addEventListener("click",e=>{ if(e.target===modal) modal.classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") modal.classList.remove("open"); });

function copyText(t){
  navigator.clipboard.writeText(t).then(showToast).catch(()=>{
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); showToast();
  });
}
function showToast(){
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}
document.getElementById("mCopy").addEventListener("click",()=>curDoc && copyText(curDoc.text));
document.getElementById("mCopy2").addEventListener("click",()=>curDoc && copyText(curDoc.text));
document.querySelectorAll("[data-copy]").forEach(btn=>{
  btn.addEventListener("click",e=>{
    e.stopPropagation();
    const d = DOCS.find(x=>x.id==btn.dataset.copy);
    if(d) copyText(d.text);
  });
});
</script>
</body>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIGC Portfolio · 电竞视觉档案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Inter:wght@400;500;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070d;
  --bg-2:#0d0d16;
  --ink:#f4f4f8;
  --ink-2:#a8a8b8;
  --ink-3:#6b6b7c;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(209,49,120,.35);
  --accent:#d13178;
  --accent-2:#ff4d97;
  --accent-deep:#8a1f4e;
  --cyan:#2bb8c9;
  --orange:#ff8a2a;
  --purple:#8a5cf0;
}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* 背景网格 + 玫红辉光 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 600px at 75% 20%, rgba(209,49,120,.18), transparent 60%),
    radial-gradient(800px 500px at 15% 80%, rgba(138,92,240,.08), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at center, #000 30%, transparent 80%);
}

/* 色谱条 */
.spectrum{
  position:fixed;top:0;left:0;right:0;height:6px;z-index:50;
  display:grid;grid-template-columns:repeat(7,1fr);
}
.spectrum span{display:block;height:100%}

.stage{
  position:relative;z-index:1;
  height:100vh;display:grid;
  grid-template-columns:minmax(360px,38%) 1fr;
  gap:0;
}

/* 左栏 */
.left{
  padding:56px 48px 32px;
  display:flex;flex-direction:column;justify-content:space-between;
  border-right:1px solid var(--line);
  position:relative;z-index:2;
}
.brand{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;letter-spacing:.02em;
}
.brand .logo{
  font-weight:900;letter-spacing:.08em;
  font-family:"Orbitron","Inter",sans-serif;
}
.brand .logo em{font-style:normal;color:var(--accent-2)}
.brand .brand-group{display:flex;align-items:center}
.signature{
  display:inline-flex;align-items:baseline;gap:8px;
  margin-left:14px;padding-left:14px;
  border-left:1px solid rgba(255,255,255,.22);
  font-size:12px;letter-spacing:.3em;
  color:rgba(244,244,248,.92);font-weight:500;
}
.signature em{
  font-style:normal;font-size:10px;letter-spacing:.28em;
  color:var(--accent-2);text-transform:uppercase;font-weight:700;
  font-family:"Orbitron","Inter",sans-serif;
}
.brand .year{
  color:var(--ink-3);font-size:11px;letter-spacing:.2em;
  font-family:"Orbitron",sans-serif;
}

.hero-block{margin-top:44px;position:relative}
.slash{
  font-family:"Orbitron",sans-serif;
  font-size:120px;font-weight:900;line-height:.8;
  background:linear-gradient(135deg, #fff 0%, var(--accent-2) 55%, var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.02em;
  filter:drop-shadow(0 0 24px rgba(209,49,120,.45));
}
.slash small{
  display:block;margin-top:18px;
  font-family:"Inter",sans-serif;
  font-size:11px;font-weight:500;letter-spacing:.32em;
  color:var(--ink-2);text-transform:uppercase;
}
.hero-block h1{
  margin-top:26px;
  font-family:"Noto Serif SC",serif;
  font-size:clamp(26px,2.4vw,36px);font-weight:900;
  line-height:1.25;letter-spacing:-.01em;
}
.hero-block h1 em{
  font-style:normal;
  background:linear-gradient(135deg, var(--accent-2), var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-block p{
  margin-top:18px;color:var(--ink-2);
  font-size:13px;line-height:1.75;max-width:340px;
}

.tag-row{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.tag{
  font-family:"Orbitron",sans-serif;
  font-size:10px;letter-spacing:.18em;
  padding:6px 10px;border:1px solid var(--line-2);
  color:var(--accent-2);border-radius:2px;
  background:rgba(209,49,120,.08);
  text-transform:uppercase;
}

.stats{
  margin-top:32px;display:flex;gap:28px;flex-wrap:wrap;
  padding-top:22px;border-top:1px solid var(--line);
}
.stats div{font-size:10px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.stats b{
  display:block;font-family:"Orbitron",sans-serif;
  color:var(--ink);font-size:24px;font-weight:900;letter-spacing:0;
  text-transform:none;margin-bottom:2px;
}
.stats b i{font-style:normal;color:var(--accent-2)}

.footer{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding-top:24px;border-top:1px solid var(--line);
}
.footer .links{display:flex;flex-direction:column;gap:8px;font-size:12px}
.footer .links a{color:var(--ink-2);transition:color .2s}
.footer .links a:hover{color:var(--ink)}
.footer .links a.primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 20px;border-radius:999px;
  background:linear-gradient(135deg, var(--accent-2), var(--accent));
  color:#fff;font-weight:700;letter-spacing:.06em;
  box-shadow:0 8px 28px rgba(209,49,120,.45);
  position:relative;overflow:hidden;isolation:isolate;
  transition:transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .25s, filter .25s;
}
.footer .links a.primary:hover{
  box-shadow:0 14px 40px rgba(209,49,120,.7);
  filter:brightness(1.08);
}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.footer .links a.ghost{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 20px;border-radius:999px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.04);
  color:#f4f4f8;font-weight:600;letter-spacing:.06em;
  position:relative;overflow:hidden;isolation:isolate;
  backdrop-filter:blur(6px);
  transition:transform .18s cubic-bezier(.2,.7,.2,1), border-color .25s, background .25s, box-shadow .25s;
}
.footer .links a.ghost:hover{
  border-color:var(--accent-2);
  background:rgba(209,49,120,.16);
  box-shadow:0 12px 34px rgba(209,49,120,.35);
}
/* 光标光斑 */
.btn-row a::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(110px circle at var(--mx,50%) var(--my,50%),
    rgba(255,255,255,.35), rgba(255,255,255,0) 65%);
  opacity:0;transition:opacity .25s;
}
.btn-row a:hover::before{opacity:1}
.btn-row a .arw{
  display:inline-block;
  transition:transform .25s cubic-bezier(.2,.7,.2,1);
}
.btn-row a:hover .arw{transform:translateX(4px)}
.btn-row a.ghost:hover .arw{transform:translate(3px,-3px)}
.footer .links a.primary,
.footer .links a.ghost{will-change:transform}
}
.footer .cc{font-size:10px;color:var(--ink-3);letter-spacing:.14em;text-align:right;line-height:1.7}
.footer .cc b{color:var(--accent-2);font-family:"Orbitron",sans-serif;font-weight:700}

/* 右栏 · 扑克堆叠 */
.right{
  position:relative;overflow:hidden;
  padding:60px 40px;
  height:100vh;
}
.right::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 300px at 60% 60%, rgba(209,49,120,.12), transparent 70%);
}

.poster{
  position:absolute;overflow:hidden;
  cursor:pointer;
  background:#14141c;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 24px 60px rgba(0,0,0,.6),
    0 0 0 1px rgba(209,49,120,.15);
  transition:transform .5s cubic-bezier(.2,.7,.2,1), z-index 0s, box-shadow .4s;
  width:54%;
  aspect-ratio:16/10;
}
.poster:hover{
  transform:translateX(12px) rotate(0deg) scale(1.04) !important;
  z-index:99 !important;
  box-shadow:
    0 30px 80px rgba(0,0,0,.7),
    0 0 40px rgba(209,49,120,.35);
}
.poster img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.2,1), filter .4s;
  filter:saturate(1.05) contrast(1.02);
}
.poster:hover img{transform:scale(1.05)}
.poster .label{
  position:absolute;left:0;right:0;bottom:0;
  padding:16px 14px 12px;
  background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.85) 100%);
  color:#fff;
}
.poster .label .name{
  font-family:"Noto Serif SC",serif;
  font-size:14px;font-weight:700;line-height:1.2;
}
.poster .label .meta{
  margin-top:4px;font-size:10px;letter-spacing:.18em;
  color:var(--accent-2);text-transform:uppercase;
  font-family:"Orbitron",sans-serif;
}
.poster .swatch{
  position:absolute;top:12px;left:12px;
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 0 12px var(--accent);
}

/* Lightbox */
.lb{
  position:fixed;inset:0;z-index:100;
  background:rgba(8,8,14,.95);backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;
}
.lb.open{display:flex}
.lb img{max-width:86vw;max-height:80vh;border-radius:8px;border:1px solid var(--line-2)}
.lb .close{
  position:absolute;top:24px;right:24px;
  background:none;border:1px solid var(--line-2);color:#fff;
  padding:10px 16px;border-radius:999px;
  font-size:12px;cursor:pointer;letter-spacing:.1em;
}
.lb .cap{
  position:absolute;left:6vw;bottom:4vh;color:var(--ink-2);
  font-size:12px;letter-spacing:.05em;max-width:600px;
}
.lb .cap b{color:#fff;font-family:"Noto Serif SC",serif;
  font-size:15px;display:block;margin-bottom:4px}

@media(max-width:900px){
  html,body{height:auto;overflow:auto}
  .stage{height:auto;grid-template-columns:1fr}
  .left{border-right:none;border-bottom:1px solid var(--line);padding:60px 20px 24px}
  .brand-group{flex-wrap:wrap;row-gap:6px}
  .signature{font-size:11px;letter-spacing:.24em;margin-left:10px;padding-left:10px}
  .signature em{font-size:9px;letter-spacing:.2em}
  .right{padding:20px;height:auto;overflow:visible}
  #wall{position:relative;inset:auto;display:flex;flex-direction:column;gap:16px;height:auto}
  .poster{position:relative !important;top:auto !important;left:auto !important;transform:none !important;width:100% !important}
  .poster:hover{transform:scale(1.02) !important}
  .slash{font-size:80px}
}
</style>
</head>
<body>

<div class="spectrum">
  <span style="background:linear-gradient(90deg,#d13178,#ff4d97)"></span>
  <span style="background:linear-gradient(90deg,#d13178,#8a5cf0)"></span>
  <span style="background:linear-gradient(90deg,#8a5cf0,#2bb8c9)"></span>
  <span style="background:linear-gradient(90deg,#2bb8c9,#0d0d16)"></span>
  <span style="background:linear-gradient(90deg,#0d0d16,#3a3a3a)"></span>
  <span style="background:linear-gradient(90deg,#3a3a3a,#d13178)"></span>
  <span style="background:#d13178"></span>
</div>

<main class="stage">

  <aside class="left">
    <div>
      <div class="brand">
        <div class="brand-group">
          <div class="logo">AIGC<em>//</em>ESPORTS</div>
          <span class="signature">张庭海 <em>tinghai</em></span>
        </div>
        <div class="year">© 2026 · GZ</div>
      </div>

      <div class="hero-block">
        <div class="slash">/
          <small>esports visual archive · vol.01</small>
        </div>
        <h1>把品牌素材，<br>变成<em>电竞视觉。</em></h1>
        <p>129 张超高清 AI 生成作品，按 7 个品类归档。RAW 画质 · 高细节 · 霓虹美学，每一组都是一种可商用的视觉语言。</p>
        <div class="tag-row">
          <span class="tag">RAW</span>
          <span class="tag">8K</span>
          <span class="tag">NEO-NOIR</span>
          <span class="tag">ESPORTS</span>
        </div>
      </div>

      <div class="stats">
        <div><b>129</b>张精选图</div>
        <div><b>7</b>个品类系列</div>
        <div><b>03–11</b>月跨度</div>
      </div>
    </div>

    <div class="footer">
      <div class="links">
        <a href="index-v2.html">← 单页叙事版</a>
        <a href="prompts.html">AI 提示词库 →</a>
        <a href="mailto:2805059624@qq.com">2805059624@qq.com</a>
        <div class="btn-row">
          <a class="primary magnetic" href="index-v2.html">进入 AI 作品页 <span class="arw">→</span></a>
          <a class="ghost magnetic" href="portfolio.pdf" target="_blank" rel="noopener">浏览作品集 <span class="arw">↗</span></a>
        </div>
      </div>
      <div class="cc">
        <b>WORKFLOW</b><br>
        MJ · Flux · LoRA<br>PS · LR
      </div>
    </div>
  </aside>

  <section class="right" id="wall">
    <!-- 卡片由 JS 注入 -->
  </section>

</main>

<div class="lb" id="lb">
  <button class="close" id="lbClose">关闭 ×</button>
  <img id="lbImg" src="">
  <div class="cap" id="lbCap"></div>
</div>

<script>
const series = [
  {id:"red",    color:"#e63329", month:"2026.03", name:"红黑电竞 · RO姬",
   thumb:"assets/thumb/red/r4.jpg", works:10},
  {id:"cyan",   color:"#2bb8c9", month:"2026.04", name:"蓝青冷色 · 初音",
   thumb:"assets/thumb/cyan/c4.jpg", works:13},
  {id:"pink",   color:"#f089b3", month:"2026.05", name:"粉白柔美 · 奶白桌搭",
   thumb:"assets/thumb/pink/p1.jpg", works:7},
  {id:"neon",    color:"#8a5cf0", month:"2026.06–07", name:"霓虹灯光 · iGame × ROG",
   thumb:"assets/thumb/purple/u1.jpg", works:14},
  {id:"product", color:"#5fd6a4", month:"2026.08–11", name:"产品特写 · 耳机 / 显卡",
   thumb:"assets/thumb/gpu/g1.jpg", works:31},
  {id:"desk",    color:"#3a3a3a", month:"2026.09–11", name:"无人桌搭 · 电商图",
   thumb:"assets/thumb/cyan/c1.jpg", works:22},
  {id:"other",   color:"#ff7ab8", month:"2026.11", name:"其他",
   thumb:"assets/thumb/portrait/h04.jpg", works:32},
];

const wall = document.getElementById("wall");
series.forEach((s,i)=>{
  const p = document.createElement("a");
  p.className = "poster";
  p.href = "index-v2.html#timeline";
  p.innerHTML = `
    <span class="swatch" style="background:${s.color};box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 12px ${s.color}"></span>
    <img src="${s.thumb}" alt="${s.name}">
    <div class="label">
      <div class="name">${s.name}</div>
      <div class="meta">${s.month} · ${s.works} works</div>
    </div>`;
  const W = wall.clientWidth, H = wall.clientHeight;
  const n = series.length;
  const pad = 24;
  const availW = W - pad * 2, availH = H - pad * 2;
  const cardW = availW * (n >= 10 ? 0.46 : 0.54), cardH = cardW * 10 / 16;
  const stepX = Math.min(n >= 10 ? 42 : 26, Math.max(14, (availW - cardW) / Math.max(1, n - 1)));
  const stepY = Math.min(n >= 10 ? 38 : 18, Math.max(10, (availH - cardH) / Math.max(1, n - 1)));
  const startX = (W - cardW - stepX * (n - 1)) / 2;
  const startY = (H - cardH - stepY * (n - 1)) / 2;
  const rot = (i - (n - 1) / 2) * 0.9;
  p.style.top = (startY + stepY * i) + "px";
  p.style.left = (startX + stepX * i) + "px";
  p.style.width = cardW + "px";
  p.style.transform = "rotate(" + rot.toFixed(2) + "deg)";
  p.style.zIndex = i;
  p.addEventListener("click",ev=>{
    if(!ev.metaKey && !ev.ctrlKey){ return; }
    ev.preventDefault();
    openLB(s.thumb.replace("assets/thumb/", "assets/"), s.name, s);
  });
  wall.appendChild(p);
});

const lb = document.getElementById("lb");
function openLB(src,title,s){
  document.getElementById("lbImg").src = src;
  document.getElementById("lbCap").innerHTML =
    `<b>${title}</b>${s.name} · ${s.month} · ${s.works} works`;
  lb.classList.add("open");
}
function closeLB(){ lb.classList.remove("open"); }
document.getElementById("lbClose").addEventListener("click",closeLB);
lb.addEventListener("click",ev=>{ if(ev.target===lb) closeLB(); });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeLB(); });

// 按钮：光标磁吸 + 光斑跟随
document.querySelectorAll(".btn-row a.magnetic").forEach(btn=>{
  const strength = 7;
  btn.addEventListener("mousemove",ev=>{
    const r = btn.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    btn.style.setProperty("--mx", x + "px");
    btn.style.setProperty("--my", y + "px");
    const dx = (x - r.width / 2) / (r.width / 2);
    const dy = (y - r.height / 2) / (r.height / 2);
    btn.style.transform = `translate(${(dx*strength).toFixed(2)}px, ${(dy*strength*0.6).toFixed(2)}px)`;
  });
  btn.addEventListener("mouseleave",()=>{
    btn.style.transform = "";
    btn.style.setProperty("--mx","50%");
    btn.style.setProperty("--my","50%");
  });
});
</script>
</body>
</html>
